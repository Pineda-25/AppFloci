<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppFloci | Comprobantes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Gestión de comprobantes</h1>
    <section aria-labelledby="registro-titulo">
      <h2 id="registro-titulo">Registrar comprobante</h2>
      <form id="form-comprobante">
        <p><label for="tipo">Tipo de comprobante</label><br>
          <select id="tipo" name="tipo" required>
            <option value="">Selecciona una opción</option>
            <option value="boleta">Boleta</option>
            <option value="factura">Factura</option>
          </select>
        </p>
        <p><label for="fecha">Fecha de emisión</label><br>
          <input id="fecha" name="fecha" type="date" required>
        </p>
        <p><label for="usuario">Nombre del usuario</label><br>
          <input id="usuario" name="usuario" type="text" required>
        </p>
        <p><label for="tienda">Tienda</label><br>
          <select id="tienda" name="tienda" required>
            <option value="">Selecciona una tienda</option>
            <option value="Chincha">Chincha</option>
            <option value="Pisco">Pisco</option>
            <option value="Ica">Ica</option>
          </select>
        </p>
        <p><label for="observacion">Observación (opcional)</label><br>
          <textarea id="observacion" name="observacion" rows="3"></textarea>
        </p>
        <p><label for="imagen">Imagen del comprobante (JPG o PNG)</label><br>
          <input id="imagen" name="imagen" type="file" accept="image/jpeg,image/png" required>
        </p>
        <button type="submit">Registrar comprobante</button>
        <p id="mensaje-formulario" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section aria-labelledby="lista-titulo">
      <h2 id="lista-titulo">Comprobantes registrados</h2>
      <table>
        <thead>
          <tr><th scope="col">Tipo</th><th scope="col">Fecha</th><th scope="col">Usuario</th><th scope="col">Tienda</th><th scope="col">Observación</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr>
        </thead>
        <tbody id="lista-comprobantes">
          <tr><td colspan="7">Aún no hay comprobantes registrados.</td></tr>
        </tbody>
      </table>
      <p id="mensaje-lista" role="status" aria-live="polite"></p>
    </section>
    <dialog id="dialogo-json" aria-labelledby="titulo-json">
      <h2 id="titulo-json">Resultado de Textract</h2>
      <pre id="contenido-json"></pre>
      <button type="button" id="cerrar-json">Cerrar</button>
    </dialog>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
